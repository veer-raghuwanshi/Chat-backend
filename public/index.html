<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Backend - Live Testing Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --sent-bubble: #2563eb;
      --received-bubble: #334155;
      --read-check: #38bdf8;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Top Navigation */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo { width: 36px; height: 36px; background: var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; color: #fff; }
    .brand-title { font-size: 16px; font-weight: 700; }
    .brand-subtitle { font-size: 12px; color: var(--text-muted); }

    .user-switcher { display: flex; align-items: center; gap: 12px; background: #0f172a; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--card-border); }
    .user-switcher label { font-size: 13px; color: var(--text-muted); }
    .user-switcher select { background: transparent; color: #fff; border: none; font-size: 14px; font-weight: 600; outline: none; cursor: pointer; }
    .user-switcher select option { background: var(--card-bg); color: #fff; }

    .status-badge { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--success); background: rgba(16, 185, 129, 0.1); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.2); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 8px var(--success); }

    /* App Container */
    .app-layout { display: flex; flex: 1; height: calc(100vh - 61px); overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 340px; background: var(--card-bg); border-right: 1px solid var(--card-border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid var(--card-border); display: flex; gap: 8px; }
    .btn { padding: 8px 14px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #334155; color: #f8fafc; }
    .btn-secondary:hover { background: #475569; }

    .chat-list { flex: 1; overflow-y: auto; list-style: none; }
    .chat-item { padding: 14px 16px; border-bottom: 1px solid rgba(51, 65, 85, 0.4); cursor: pointer; display: flex; gap: 12px; align-items: center; transition: background 0.15s; }
    .chat-item:hover { background: rgba(255, 255, 255, 0.03); }
    .chat-item.active { background: rgba(59, 130, 246, 0.15); border-left: 3px solid var(--primary); }
    .chat-avatar { width: 44px; height: 44px; border-radius: 50%; background: #475569; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; flex-shrink: 0; }
    .chat-info { flex: 1; min-width: 0; }
    .chat-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .chat-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-badge { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: #334155; color: var(--text-muted); text-transform: uppercase; }
    .chat-badge.group { background: #3b82f6; color: #fff; }
    .chat-subtext { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Chat Area */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: #0b1120; }
    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); text-align: center; gap: 12px; }
    .empty-icon { font-size: 48px; }

    .chat-header { padding: 14px 20px; background: var(--card-bg); border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
    .chat-header-info h2 { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
    .chat-header-info p { font-size: 12px; color: var(--text-muted); }

    .messages-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg-group { display: flex; flex-direction: column; max-width: 68%; gap: 3px; position: relative; }
    .msg-group.sent { align-self: flex-end; align-items: flex-end; }
    .msg-group.received { align-self: flex-start; align-items: flex-start; }

    .msg-sender { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 2px; }
    .msg-bubble { padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.45; word-break: break-word; position: relative; }
    .msg-group.sent .msg-bubble { background: var(--sent-bubble); color: #fff; border-bottom-right-radius: 4px; }
    .msg-group.received .msg-bubble { background: var(--received-bubble); color: #f8fafc; border-bottom-left-radius: 4px; }
    .msg-bubble.deleted { font-style: italic; opacity: 0.6; }

    .msg-meta { display: flex; align-items: center; gap: 6px; font-size: 10px; color: rgba(255, 255, 255, 0.7); margin-top: 4px; align-self: flex-end; }
    .check-icon { font-weight: 700; }
    .check-icon.read { color: var(--read-check); }

    .msg-actions { opacity: 0; transition: opacity 0.2s; position: absolute; top: -14px; display: flex; gap: 4px; background: #1e293b; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--card-border); }
    .msg-group:hover .msg-actions { opacity: 1; }
    .msg-actions button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 11px; padding: 2px 4px; }
    .msg-actions button:hover { color: #fff; }

    /* Chat Input */
    .chat-input-bar { padding: 16px 20px; background: var(--card-bg); border-top: 1px solid var(--card-border); display: flex; gap: 12px; align-items: center; }
    .chat-input { flex: 1; background: #0f172a; border: 1px solid var(--card-border); padding: 12px 16px; border-radius: 10px; color: #fff; font-size: 14px; outline: none; }
    .chat-input:focus { border-color: var(--primary); }

    /* Modal */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; width: 440px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 18px; font-weight: 700; }
    .modal-close { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }
    .modal-body { display: flex; flex-direction: column; gap: 14px; }
    .modal-body select, .modal-body input { width: 100%; background: #0f172a; border: 1px solid var(--card-border); padding: 10px 14px; border-radius: 8px; color: #fff; font-size: 14px; }
    .modal-body select[multiple] { height: 110px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-logo">💬</div>
      <div>
        <div class="brand-title">Codes For Tomorrow</div>
        <div class="brand-subtitle">Chat Backend Live Testing Portal</div>
      </div>
    </div>

    <!-- User Switcher -->
    <div class="user-switcher">
      <label for="activeUserSelect">Acting As:</label>
      <select id="activeUserSelect" onchange="handleUserChange(this.value)">
        <!-- Populated via /user/list -->
      </select>
    </div>

    <!-- Health Status -->
    <div class="status-badge" id="statusBadge">
      <span class="status-dot"></span>
      <span id="statusText">Checking...</span>
    </div>
  </header>

  <!-- App Layout -->
  <div class="app-layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <button class="btn btn-primary" style="flex:1" onclick="openDirectChatModal()">+ 1:1 Chat</button>
        <button class="btn btn-secondary" style="flex:1" onclick="openGroupChatModal()">+ Group</button>
      </div>
      <ul class="chat-list" id="chatList">
        <!-- Rendered chats -->
      </ul>
    </div>

    <!-- Chat View -->
    <div class="chat-area" id="chatArea">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">💬</div>
        <h3>Select a Chat to Start Messaging</h3>
        <p>Pick a chat from the left sidebar or start a new direct/group conversation.</p>
      </div>

      <div id="activeChatContainer" style="display: none; height: 100%; display: flex; flex-direction: column; flex: 1;">
        <div class="chat-header">
          <div class="chat-header-info">
            <h2 id="activeChatTitle">Chat Title</h2>
            <p id="activeChatParticipants">Participants</p>
          </div>
          <div>
            <span class="chat-badge" id="activeChatType">DIRECT</span>
          </div>
        </div>

        <div class="messages-container" id="messagesContainer">
          <!-- Messages will load here -->
        </div>

        <div class="chat-input-bar">
          <input type="text" id="messageInput" class="chat-input" placeholder="Type a message... (Press Enter to send)" onkeydown="if(event.key === 'Enter') handleSendMessage()">
          <button class="btn btn-primary" onclick="handleSendMessage()">Send ➔</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Direct Chat Modal -->
  <div class="modal-backdrop" id="directModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Start 1:1 Direct Chat</h3>
        <button class="modal-close" onclick="closeModal('directModal')">&times;</button>
      </div>
      <div class="modal-body">
        <label style="font-size: 13px; color: var(--text-muted)">Select a user to chat with:</label>
        <select id="directUserSelect"></select>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('directModal')">Cancel</button>
        <button class="btn btn-primary" onclick="handleCreateDirectChat()">Start Chat</button>
      </div>
    </div>
  </div>

  <!-- Group Chat Modal -->
  <div class="modal-backdrop" id="groupModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Create Group Chat</h3>
        <button class="modal-close" onclick="closeModal('groupModal')">&times;</button>
      </div>
      <div class="modal-body">
        <label style="font-size: 13px; color: var(--text-muted)">Group Name:</label>
        <input type="text" id="groupNameInput" placeholder="e.g. Engineering Team">

        <label style="font-size: 13px; color: var(--text-muted); margin-top: 6px;">Select Members (Hold Ctrl/Cmd to select multiple):</label>
        <select id="groupUsersSelect" multiple></select>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('groupModal')">Cancel</button>
        <button class="btn btn-primary" onclick="handleCreateGroupChat()">Create Group</button>
      </div>
    </div>
  </div>

  <script>
    let users = [];
    let currentUserId = 'usr_veerendra';
    let currentChatId = null;
    let chats = [];
    let pollInterval = null;

    // 1. Initial Load
    async function init() {
      await checkHealth();
      await loadUsers();
      await loadUserChats();
      startPolling();
    }

    async function checkHealth() {
      try {
        const res = await fetch('/health');
        const data = await res.json();
        document.getElementById('statusText').innerText = 'Connected (PostgreSQL + Firestore)';
      } catch (e) {
        document.getElementById('statusText').innerText = 'Server Offline';
      }
    }

    async function loadUsers() {
      try {
        const res = await fetch('/user/list');
        const data = await res.json();
        users = data.users || [];

        const select = document.getElementById('activeUserSelect');
        select.innerHTML = users.map(u => `<option value="${u.id}" ${u.id === currentUserId ? 'selected' : ''}>${u.name} (${u.id})</option>`).join('');

        populateModalUsers();
      } catch (e) {
        console.error('Failed to load users:', e);
      }
    }

    function populateModalUsers() {
      const otherUsers = users.filter(u => u.id !== currentUserId);
      document.getElementById('directUserSelect').innerHTML = otherUsers.map(u => `<option value="${u.id}">${u.name} (${u.email})</option>`).join('');
      document.getElementById('groupUsersSelect').innerHTML = otherUsers.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
    }

    async function handleUserChange(newUserId) {
      currentUserId = newUserId;
      currentChatId = null;
      document.getElementById('emptyState').style.display = 'flex';
      document.getElementById('activeChatContainer').style.display = 'none';
      populateModalUsers();
      await loadUserChats();
    }

    async function loadUserChats() {
      try {
        const res = await fetch(`/user/${currentUserId}/chats`);
        const data = await res.json();
        chats = data.chats || [];
        renderChatList();
      } catch (e) {
        console.error('Failed to load chats:', e);
      }
    }

    function renderChatList() {
      const listEl = document.getElementById('chatList');
      if (chats.length === 0) {
        listEl.innerHTML = `<li style="padding: 24px; text-align: center; color: var(--text-muted); font-size: 13px;">No chats yet. Click "+ 1:1 Chat" to start.</li>`;
        return;
      }

      listEl.innerHTML = chats.map(c => {
        const isGroup = c.type === 'GROUP';
        let title = c.name;
        if (!isGroup) {
          const otherId = c.memberIds.find(id => id !== currentUserId) || currentUserId;
          const otherUser = users.find(u => u.id === otherId);
          title = otherUser ? otherUser.name : otherId;
        }

        const initials = title.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        const isActive = c.chatId === currentChatId;

        return `
          <li class="chat-item ${isActive ? 'active' : ''}" onclick="selectChat('${c.chatId}')">
            <div class="chat-avatar">${initials}</div>
            <div class="chat-info">
              <div class="chat-title-row">
                <span class="chat-title">${title}</span>
                <span class="chat-badge ${isGroup ? 'group' : ''}">${c.type}</span>
              </div>
              <div class="chat-subtext">${c.memberIds.length} members</div>
            </div>
          </li>
        `;
      }).join('');
    }

    async function selectChat(chatId) {
      currentChatId = chatId;
      const chat = chats.find(c => c.chatId === chatId);
      if (!chat) return;

      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('activeChatContainer').style.display = 'flex';

      let title = chat.name;
      if (chat.type !== 'GROUP') {
        const otherId = chat.memberIds.find(id => id !== currentUserId) || currentUserId;
        const otherUser = users.find(u => u.id === otherId);
        title = otherUser ? otherUser.name : otherId;
      }

      document.getElementById('activeChatTitle').innerText = title;
      document.getElementById('activeChatType').innerText = chat.type;
      document.getElementById('activeChatParticipants').innerText = 'Members: ' + chat.memberIds.map(id => {
        const u = users.find(x => x.id === id);
        return u ? u.name.split(' ')[0] : id;
      }).join(', ');

      renderChatList();
      await loadMessages();
    }

    async function loadMessages() {
      if (!currentChatId) return;

      try {
        const res = await fetch(`/chat/${currentChatId}/messages?limit=50`);
        const data = await res.json();
        const messages = data.messages || [];

        renderMessages(messages);

        // Auto mark unread messages as read
        for (const msg of messages) {
          if (msg.senderId !== currentUserId && !msg.readBy.some(r => r.userId === currentUserId)) {
            fetch(`/chat/${currentChatId}/message/${msg.id}/read`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ userId: currentUserId }),
            });
          }
        }
      } catch (e) {
        console.error('Failed to load messages:', e);
      }
    }

    function renderMessages(messages) {
      const container = document.getElementById('messagesContainer');
      if (messages.length === 0) {
        container.innerHTML = `<div style="text-align:center; color: var(--text-muted); font-size: 13px; margin-top: 40px;">No messages yet. Say hello! 👋</div>`;
        return;
      }

      const isScrolledToBottom = container.scrollHeight - container.clientHeight <= container.scrollTop + 60;

      container.innerHTML = messages.map(msg => {
        const isSent = msg.senderId === currentUserId;
        const sender = users.find(u => u.id === msg.senderId);
        const senderName = sender ? sender.name : msg.senderId;
        const time = new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        // Check if read by anyone else
        const isRead = msg.readBy && msg.readBy.some(r => r.userId !== msg.senderId);

        return `
          <div class="msg-group ${isSent ? 'sent' : 'received'}">
            ${!isSent ? `<span class="msg-sender">${senderName}</span>` : ''}
            <div class="msg-bubble ${msg.isDeleted ? 'deleted' : ''}">
              ${escapeHtml(msg.text)}
              <div class="msg-meta">
                <span>${time}</span>
                ${isSent ? `<span class="check-icon ${isRead ? 'read' : ''}">${isRead ? '✓✓' : '✓'}</span>` : ''}
              </div>
            </div>
            ${isSent && !msg.isDeleted ? `
              <div class="msg-actions">
                <button onclick="handleEditMessage('${msg.id}', '${escapeHtml(msg.text)}')">✏️</button>
                <button onclick="handleDeleteMessage('${msg.id}')">🗑️</button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      if (isScrolledToBottom) {
        container.scrollTop = container.scrollHeight;
      }
    }

    async function handleSendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !currentChatId) return;

      input.value = '';

      try {
        await fetch(`/chat/${currentChatId}/message/send`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ senderId: currentUserId, text }),
        });
        await loadMessages();
      } catch (e) {
        console.error('Failed to send:', e);
      }
    }

    async function handleEditMessage(messageId, oldText) {
      const newText = prompt('Edit your message:', oldText);
      if (!newText || newText === oldText) return;

      try {
        await fetch(`/chat/${currentChatId}/message/${messageId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ senderId: currentUserId, text: newText }),
        });
        await loadMessages();
      } catch (e) {
        console.error('Edit error:', e);
      }
    }

    async function handleDeleteMessage(messageId) {
      if (!confirm('Are you sure you want to delete this message?')) return;

      try {
        await fetch(`/chat/${currentChatId}/message/${messageId}`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ senderId: currentUserId }),
        });
        await loadMessages();
      } catch (e) {
        console.error('Delete error:', e);
      }
    }

    async function handleCreateDirectChat() {
      const targetUserId = document.getElementById('directUserSelect').value;
      if (!targetUserId) return;

      try {
        const res = await fetch('/chat/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userAId: currentUserId, userBId: targetUserId }),
        });
        const data = await res.json();
        closeModal('directModal');
        await loadUserChats();
        if (data.chatId) selectChat(data.chatId);
      } catch (e) {
        console.error('Create chat error:', e);
      }
    }

    async function handleCreateGroupChat() {
      const name = document.getElementById('groupNameInput').value.trim();
      const select = document.getElementById('groupUsersSelect');
      const selectedMembers = Array.from(select.selectedOptions).map(opt => opt.value);

      if (!name || selectedMembers.length === 0) {
        alert('Please enter group name and select at least one other member');
        return;
      }

      try {
        const res = await fetch('/chat/group/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ creatorId: currentUserId, name, memberIds: selectedMembers }),
        });
        const data = await res.json();
        closeModal('groupModal');
        document.getElementById('groupNameInput').value = '';
        await loadUserChats();
        if (data.id) selectChat(data.id);
      } catch (e) {
        console.error('Group create error:', e);
      }
    }

    function openDirectChatModal() { document.getElementById('directModal').classList.add('open'); }
    function openGroupChatModal() { document.getElementById('groupModal').classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }

    function startPolling() {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(() => {
        if (currentChatId) loadMessages();
      }, 2500);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    init();
  </script>
</body>
</html>
